<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book CNG Slot</title>

    <link rel="stylesheet" href="booking.css">
</head>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #171022,
        #ffffff,
        #f0f0f0
    );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.bunk-card {
    background: rgba(255, 255, 255, 0.103);

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 25px;

    padding: 30px;

    backdrop-filter: blur(15px);

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.bunk-card h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="date"] {
    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border: none;

    background: #fff;

    color: #222;

    font-size: 16px;

    margin-bottom: 25px;
}

h3 {
    margin-bottom: 15px;
}

.time-section {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 12px;
}

.time-section button {
    padding: 15px;

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.1);

    color: white;

    font-size: 15px;

    cursor: pointer;

    transition: 0.3s;
}

.time-section button:hover {
    background: #8b5cf6;

    transform: translateY(-2px);
}

.slots {
    margin-top: 25px;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
}

.slot {
    padding: 13px;

    border: none;

    border-radius: 12px;

    background: #251b38;

    color: white;

    cursor: pointer;

    transition: 0.3s;
}

.slot:hover {
    background: #6d3fc4;
}

.slot.selected {
    background: #9b6cff;

    box-shadow: 0 0 15px rgba(155, 108, 255, 0.5);
}

.confirm-btn {
    width: 100%;

    margin-top: 25px;

    padding: 16px;

    border: none;

    border-radius: 14px;

    background: linear-gradient(
        135deg,
        #8b5cf6,
        #a855f7
    );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.confirm-btn:hover {
    transform: translateY(-2px);

    box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
}

@media (max-width: 500px) {

    .bunk-card {
        padding: 20px;
    }

    .time-section,
    .slots {
        grid-template-columns: 1fr;
    }
}

</style>
<body>

    <div class="container">

        <h1>Book CNG Slot</h1>

        <div class="bunk-card">
            <h2 id="bunkName">CNG Bunk</h2>

            <label for="date">Select Date</label>
            <input type="date" id="date">

            <h3>Select Time</h3>

            <div class="time-section">

                <button onclick="showSlots('midnight')">
                    🌙 Midnight
                </button>

                <button onclick="showSlots('morning')">
                    🌅 Morning
                </button>

                <button onclick="showSlots('afternoon')">
                    ☀️ Afternoon
                </button>

                <button onclick="showSlots('evening')">
                    🌆 Evening
                </button>

                <button onclick="showSlots('night')">
                    🌙 Night
                </button>

            </div>

            <div id="slots" class="slots"></div>

            <button class="confirm-btn" onclick="confirmBooking()">
                Confirm Booking
            </button>

        </div>

    </div>

    <script src="booking.js"></script>

</body>

</html>
