<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book CNG Slot - Torrent CNG</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fff5;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h3 {
            text-align: center;
            color: #399e0a;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #399e0a;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* USER INFO */

        .user-info {
            background: #f0faec;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .user-info strong {
            color: #399e0a;
        }

        /* DATE */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="date"] {
            width: 100%;
            height: 48px;

            padding: 10px;

            border: 1px solid #399e0a;
            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 30px;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #209b20;
        }

        /* SECTION TITLE */

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }

        /* SHIFT */

        .shifts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;

            margin-bottom: 25px;
        }

        .shift {
            border: 2px solid #dcefd5;

            background: white;

            border-radius: 14px;

            padding: 20px 10px;

            cursor: pointer;

            text-align: center;

            transition: 0.2s;
        }

        .shift:hover {
            border-color: #399e0a;
        }

        .shift.active {
            background: #399e0a;
            border-color: #399e0a;
            color: white;
        }

        .shift-title {
            font-size: 20px;
            font-weight: bold;

            display: block;

            margin-bottom: 8px;
        }

        .shift-time {
            font-size: 14px;
        }

        /* SLOT AREA */

        #slotSection {
            display: none;

            margin-top: 10px;
        }

        .slot-heading {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .legend {
            font-size: 12px;
        }

        .available-text {
            color: #399e0a;
            font-weight: bold;
        }

        .booked-text {
            color: red;
            font-weight: bold;
        }

        /* SLOTS */

        .slots {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;

            max-height: 350px;

            overflow-y: auto;

            padding: 5px;

            margin-bottom: 25px;
        }

        .slot {
            padding: 12px 5px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        /* AVAILABLE */

        .slot.available {
            background: #eaf8e5;

            border: 2px solid #399e0a;

            color: #399e0a;
        }

        .slot.available:hover {
            background: #399e0a;

            color: white;
        }

        /* BOOKED */

        .slot.booked {
            background: #ffe5e5;

            border: 2px solid red;

            color: red;

            cursor: not-allowed;

            opacity: 0.8;
        }

        /* SELECTED */

        .slot.selected {
            background: #399e0a;

            border: 2px solid #399e0a;

            color: white;

            box-shadow: 0 0 0 3px rgba(57, 158, 10, 0.15);
        }

        /* CONFIRM */

        .confirm-btn {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background: #399e0a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .confirm-btn:hover {
            background: #209b20;
        }

        .error {
            color: red;

            text-align: center;

            margin-top: 15px;

            display: none;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 20px;
            }

            .shifts {
                grid-template-columns: 1fr;
            }

            .slots {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h3>🚗 Torrent CNG</h3>

    <h1>Book CNG Slot</h1>

    <p class="subtitle">
        Select your date and time slot
    </p>


    <!-- USER INFORMATION -->

    <div class="user-info">

        👤 Name:
        <strong id="userName">User</strong>

        <br>

        🚗 Car:
        <strong id="carModel">Car</strong>

        <br>

        🔢 Number:
        <strong id="carNumber">Number</strong>

    </div>


    <!-- DATE -->

    <label for="bookingDate">
        📅 Select Date
    </label>

    <input
        type="date"
        id="bookingDate"
    >


    <!-- SHIFT -->

    <div class="section-title">
        ⏰ Select Time
    </div>


    <div class="shifts">

        <!-- SHIFT 1 -->

        <div
            class="shift"
            id="shift1"
            onclick="selectShift('shift1')"
        >

            <span class="shift-title">
                SHIFT-1
            </span>

            <span class="shift-time">
                12:00 AM - 12:00 PM
            </span>

        </div>


        <!-- SHIFT 2 -->

        <div
            class="shift"
            id="shift2"
            onclick="selectShift('shift2')"
        >

            <span class="shift-title">
                SHIFT-2
            </span>

            <span class="shift-time">
                12:00 PM - 12:00 AM
            </span>

        </div>

    </div>


    <!-- SLOT SECTION -->

    <div id="slotSection">

        <div class="slot-heading">

            <div class="section-title">
                ⏱️ Select 10-Minute Slot
            </div>

            <div class="legend">

                <span class="available-text">
                    🟢 Available
                </span>

                &nbsp;

                <span class="booked-text">
                    🔴 Booked
                </span>

            </div>

        </div>


        <div
            id="slots"
            class="slots"
        ></div>

    </div>


    <!-- CONFIRM -->

    <button
        class="confirm-btn"
        onclick="confirmBooking()"
    >
        CONFIRM BOOKING
    </button>


    <p
        id="errorMessage"
        class="error"
    ></p>

</div>


<script src="bookingthree.js"></script>

</body>

</html>
