<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Torrent CNG - Ticket</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .ticket {
            width: 420px;

            padding: 30px;

            background: #ffffff;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            color: #399e0a;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        .title {
            color: #555;

            margin-bottom: 20px;
        }

        .ticket-number {
            background: #399e0a;

            color: white;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-weight: bold;
        }

        .details {
            text-align: left;

            background: #f7f7f7;

            padding: 18px;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .details-title {
            text-align: center;

            color: #399e0a;

            font-size: 18px;

            margin-bottom: 18px;

            font-weight: bold;
        }

        .row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 14px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #666;

            font-weight: bold;
        }

        .value {
            color: #111;

            font-weight: bold;

            text-align: right;
        }

        .qr-section {
            margin-top: 20px;
        }

        .qr-section h3 {
            color: #399e0a;

            margin-bottom: 12px;
        }

        #qrcode {
            display: flex;

            justify-content: center;

            padding: 10px;
        }

        .scan-text {
            margin-top: 12px;

            color: #777;

            font-size: 14px;
        }

        .home-btn {
            width: 100%;

            height: 45px;

            border: none;

            border-radius: 10px;

            background: #399e0a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 20px;
        }

        .home-btn:hover {
            background: #2f8508;
        }

        @media (max-width: 500px) {

            .ticket {
                width: 100%;

                padding: 25px 20px;
            }

            .row {
                font-size: 14px;
            }
        }

    </style>


    <!-- QR Code Library -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>


<body>

    <div class="ticket">


        <!-- HEADER -->

        <div class="logo">
            🚗 Torrent CNG
        </div>

        <div class="title">
            CNG Booking Ticket
        </div>


        <!-- TICKET NUMBER -->

        <div class="ticket-number">

            🎫 Ticket No:
            <span id="ticketNumber"></span>

        </div>


        <!-- BOOKING DETAILS -->

        <div class="details">

            <div class="details-title">
                📋 BOOKING DETAILS
            </div>


            <!-- DATE -->

            <div class="row">

                <span class="label">
                    📅 Date
                </span>

                <span
                    class="value"
                    id="bookingDate"
                ></span>

            </div>


            <!-- SHIFT -->

            <div class="row">

                <span class="label">
                    ⏰ Shift
                </span>

                <span
                    class="value"
                    id="bookingShift"
                ></span>

            </div>


            <!-- TIME -->

            <div class="row">

                <span class="label">
                    🕐 Time
                </span>

                <span
                    class="value"
                    id="bookingTime"
                ></span>

            </div>


            <!-- CAR MODEL -->

            <div class="row">

                <span class="label">
                    🚗 Car
                </span>

                <span
                    class="value"
                    id="carModel"
                ></span>

            </div>


            <!-- CAR NUMBER -->

            <div class="row">

                <span class="label">
                    🔢 Number
                </span>

                <span
                    class="value"
                    id="carNumber"
                ></span>

            </div>


            <!-- USER NAME -->

            <div class="row">

                <span class="label">
                    👤 Name
                </span>

                <span
                    class="value"
                    id="userName"
                ></span>

            </div>


            <!-- PHONE -->

            <div class="row">

                <span class="label">
                    📱 Phone
                </span>

                <span
                    class="value"
                    id="phoneNumber"
                ></span>

            </div>


            <!-- BUNK -->

            <div class="row">

                <span class="label">
                    ⛽ CNG Bunk
                </span>

                <span
                    class="value"
                    id="bunkName"
                >
                    Torrent CNG
                </span>

            </div>

        </div>


        <!-- QR CODE -->

        <div class="qr-section">

            <h3>
                📱 Scan Ticket
            </h3>

            <div id="qrcode"></div>

            <p class="scan-text">
                Show this QR code at the CNG bunk
            </p>

        </div>


        <!-- DONE -->

        <button
            class="home-btn"
            onclick="goHome()"
        >
            DONE
        </button>

    </div>


    <script src="ticket.js"></script>

</body>

</html>
