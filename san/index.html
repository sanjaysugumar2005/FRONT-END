<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Torrent CNG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 40px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h3 {
            color: #399e0a;
            margin-bottom: 10px;
        }

        h1 {
            color: #399e0a;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .tagline {
            color: #399e0a;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 45px;

            padding: 10px;

            border: 1px solid #399e0a;
            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #399e0a;
        }

        button {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 8px;

            background: #399e0a;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #209b20;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 500px) {

            .container {
                width: 90%;
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h3>Welcome To</h3>

        <h1>🚗 Torrent CNG</h1>

        <p class="tagline">Your Time, Your Fuel</p>


        <!-- USERNAME -->

        <label for="userName">
            Username
        </label>

        <input
            type="text"
            id="userName"
            placeholder="Enter your name"
            maxlength="30"
        >


        <!-- PHONE NUMBER -->

        <label for="phoneNumber">
            Phone Number
        </label>

        <input
            type="tel"
            id="phoneNumber"
            placeholder="Enter 10-digit phone number"
            maxlength="10"
        >


        <!-- ENTER -->

        <button onclick="continueToBunk()">
            ENTER
        </button>


        <p id="errorMessage" class="error"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
