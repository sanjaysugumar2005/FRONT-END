<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent CNG</title>
    <link rel="stylesheet" href="style.css">
</head>
 <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #00ff00;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 400px;
    padding: 40px;

    background: rgba(255, 255, 255, 0.308);
    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

    text-align: center;
}

h3 {
    color: black;
    margin-bottom: 10px;
}

h1 {
    color: #black;
    font-size: 32px;
    margin-bottom: 10px;
}

.container > p {
    color: black;
    margin-bottom: 30px;
}

/* Labels */

label {
    display: block;
    text-align: left;

    font-weight: bold;
    margin-bottom: 8px;
}

/* Input */

input {
    width: 100%;
    height: 45px;

    padding: 10px;

    border: 1px solid #ccc;
    border-radius: 8px;

    font-size: 16px;

    margin-bottom: 15px;
}

input:focus {
    outline: none;
    border-color: black;
}

/* Buttons */

button {
    width: 100%;
    height: 45px;

    border: none;
    border-radius: 8px;

    background: #209b20;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    margin-bottom: 25px;
}

button:hover {
    background: #209b20;
}

/* Resend text */

.container p {
    color: black;
    margin-bottom: 15px;
}

/* Mobile */

@media (max-width: 500px) {

    .container {
        width: 90%;
        padding: 30px 20px;
    }

    h1 {
        font-size: 28px;
    }
}
 </style>
<body>

    <div class="container">

        <h3>Welcome To</h3>

        <h1>Torrent CNG</h1>

        <p>Your Time, Your Fuel</p>

        <!-- Phone Number -->
        <label>Phone Number</label>

        <input type="tel" placeholder="Enter phone number">
         <button onclick="sendOTP()">Send OTP</button>
      

        <!-- OTP -->
        <label>Enter OTP</label>

        <input type="text" placeholder="Enter OTP">

        <p>You can resend OTP</p>

       
       

<button onclick="resendOTP()">Resend OTP</button>

<button onclick="submitOTP()">Submit</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
