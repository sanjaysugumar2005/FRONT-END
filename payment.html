<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }


        body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000000,#ffffff);
}

.container{
    width:90%;
    max-width:1100px;
}

.payment-box{
    display:flex;
    justify-content:space-between;
    gap:40px;

    padding:40px;

    border-radius:25px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(17px);

    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.left,
.right{
    flex:1;
}

.left h2{
    color:#fff;
    font-size:34px;
}

.left p{
    color:#eee;
    margin:15px 0 30px;
}

.payment-method{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.payment-method button{
    padding:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    background:white;
    transition:.3s;
}

.payment-method button:hover{
    transform:translateX(8px);
}

.payment-method .active{
    background:#2563eb;
    color:white;
}

.right{
    background:white;
    padding:30px;
    border-radius:20px;
}

.right h3{
    margin-bottom:25px;
}

.summary{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
}

.total{
    font-size:22px;
    font-weight:bold;
}
</style>
<body>
    <div class="container">

    <div class="payment-box">

        <!-- Left Side -->
        <div class="left">

            <h2>Secure Payment</h2>
            <p>Choose your preferred payment method.</p>

            <div class="payment-method">

                <button class="active">
                    <i class="fa-solid fa-credit-card"></i>
                    Card
                </button>

                <button>
                    <i class="fa-brands fa-google-pay"></i>
                    UPI
                </button>

                <button>
                    <i class="fa-solid fa-qrcode"></i>
                    QR
                </button>

            </div>

        </div>

        <!-- Right Side -->
        <div class="right">

            <h3>Order Summary</h3>

            <div class="summary">

                <p>Product</p>
                <span>Premium Plan</span>

            </div>

            <div class="summary">

                <p>Price</p>
                <span>₹499</span>

            </div>

            <div class="summary">

                <p>GST</p>
                <span>₹90</span>

            </div>

            <hr>

            <div class="summary total">

                <p>Total</p>
                <span>₹589</span>

            </div>

        </div>

    </div>

</div>
    
</body>
</html>
