<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change text</title>
</head>
<body>
    <p id="text">Hello</p>
    <button onclick="changeText()">click me </button>
</body>
<script>
    function changeText(){
        document.getElementById("text").textContent="Welcome!";
    }

</script>
</html>
